name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            apps/chat/package-lock.json
            services/document-worker/package-lock.json

      - name: Install chat dependencies
        run: npm ci --prefix apps/chat --ignore-scripts

      - name: Test chat gateway contracts
        run: npm test --prefix apps/chat

      - name: Install and test document reader
        run: |
          npm ci --prefix services/document-worker --ignore-scripts
          npm test --prefix services/document-worker

      - name: Validate workflows, skills, template, and pilot evidence
        run: |
          node scripts/validate-workflows.mjs
          node tests/phase5/test-skills.mjs
          node scripts/validate-template-readiness.mjs
          node scripts/validate-release.mjs
          node --test tests/phase7/test-pilot-evaluator.mjs
          node scripts/evaluate-pilot.mjs --allow-pending

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n ./*.command

  powershell:
    name: Windows helper syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += $errors
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

  native-smoke:
    name: Native learner-path smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/chat/package-lock.json
            services/document-worker/package-lock.json

      - name: Run the Phase 6 packaging smoke (native path)
        if: runner.os != 'Windows'
        run: ./scripts/test-phase6.sh

      - name: Run the project-local Node bootstrap and native setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AI_SOLO_FORCE_PORTABLE_NODE = "1"
          $env:AI_SOLO_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "ai-solo-node-runtime"
          . .\scripts\windows\NodeRuntime.ps1

          $nodePath = Resolve-ProjectNode -ProjectRoot $PWD.Path -Install
          $expectedVersion = "v$((Get-Content .node-version -Raw).Trim())"
          $actualVersion = & $nodePath --version
          if ($actualVersion -ne $expectedVersion) {
            Write-Error "Expected project-local Node.js $expectedVersion, found $actualVersion."
            exit 1
          }

          $env:Path = "$(Split-Path -Parent $nodePath);$env:Path"
          & $nodePath scripts/local.mjs setup
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $nodePath scripts/local.mjs status
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Run diagnostics exactly as the learner-facing Windows launcher does.
          # A fresh setup deliberately exits 1 until the learner adds their
          # private Claude credential, so 0 and 1 are both valid here.
          $PSNativeCommandUseErrorActionPreference = $false
          & $nodePath scripts/local.mjs diagnose
          $diagnosticStatus = $LASTEXITCODE
          if ($diagnosticStatus -notin @(0, 1)) {
            Write-Error "Diagnostics exited unexpectedly with $diagnosticStatus."
            exit 1
          }
          & $nodePath scripts/local.mjs stop
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $nodePath scripts/local.mjs reset --yes
          if ($LASTEXITCODE -ne 0) { exit 1 }

  docker-smoke:
    name: Docker workflow smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0

      - name: Install smoke-test host tools
        run: sudo apt-get update && sudo apt-get install --yes jq lsof

      - name: Run Phase 3 agent smoke
        run: ./scripts/test-phase3.sh

      - name: Run Phase 4 tool smoke
        run: ./scripts/test-phase4.sh

      - name: Run Phase 5 safety smoke
        run: ./scripts/test-phase5.sh

      - name: Run Phase 7 validation smoke
        run: ./scripts/test-phase7.sh

      - name: Run Phase 8 release smoke
        run: ./scripts/test-phase8.sh
