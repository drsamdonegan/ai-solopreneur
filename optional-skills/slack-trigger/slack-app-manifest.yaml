# Slack app manifest for your agent.
#
# Replace YOUR-AGENT-ADDRESS below with your own workshop address, then paste
# the whole file into Slack at api.slack.com/apps > Create New App >
# From a manifest > YAML.
#
# Do that LAST. Slack checks the address the moment you create the app, so the
# workflow has to be published and running first, or Slack refuses to create it.
# The full order is in docs/SLACK_TRIGGER.md.

display_information:
  name: My Agent
  description: My own AI assistant.
  background_color: "#1f2229"

features:
  bot_user:
    display_name: My Agent
    always_online: false

oauth_config:
  scopes:
    bot:
      # Hear it when you @mention it in a channel.
      - app_mentions:read
      # Hear direct messages you send it.
      - im:history
      # Reply.
      - chat:write

settings:
  event_subscriptions:
    # ---------------------------------------------------------------------
    # Change this one line. Keep the /webhook/slack-events part exactly.
    # ---------------------------------------------------------------------
    request_url: https://YOUR-AGENT-ADDRESS/webhook/slack-events
    bot_events:
      # Deliberately narrow. message.channels would send your agent every
      # message in every channel it is in, which is noise, and every one of
      # them would cost you Claude credit.
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
