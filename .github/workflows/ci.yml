name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts and static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            apps/chat/package-lock.json
            services/document-worker/package-lock.json

      - name: Install chat dependencies
        run: npm ci --prefix apps/chat --ignore-scripts

      - name: Test chat gateway contracts
        run: npm test --prefix apps/chat

      - name: Install and test document reader
        run: |
          npm ci --prefix services/document-worker --ignore-scripts
          npm test --prefix services/document-worker

      - name: Validate workflows, skills, template, and pilot evidence
        run: |
          node scripts/validate-workflows.mjs
          node tests/phase5/test-skills.mjs
          node --test tests/windows/windows-contracts.test.mjs
          node scripts/validate-template-readiness.mjs
          node scripts/validate-release.mjs
          node --test tests/phase7/test-pilot-evaluator.mjs
          node scripts/evaluate-pilot.mjs --allow-pending

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n ./*.command

  powershell:
    name: Windows helper syntax
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Parse PowerShell helpers
        shell: powershell
        run: |
          $failures = @()
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failures += $errors
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Test Windows runtime selection
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/node-runtime.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

  native-smoke:
    name: Native learner-path smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/chat/package-lock.json
            services/document-worker/package-lock.json

      - name: Run the Phase 6 packaging smoke (native path)
        run: ./scripts/test-phase6.sh

  windows-native:
    name: Windows native dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install an intentionally incompatible Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.2.1'

      - name: Verify the private runtime and native binaries
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows/native-dependencies-smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

  native-integration:
    name: Native agent and resilience smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/chat/package-lock.json
            services/document-worker/package-lock.json
            tests/phase7/package-lock.json

      - name: Install browser checks
        run: |
          npm ci --prefix tests/phase7 --ignore-scripts
          cd tests/phase7
          npx playwright install --with-deps chromium

      - name: Run native agent and safety smoke
        run: ./scripts/test-phase5.sh

      - name: Run native resilience and browser smoke
        run: ./scripts/test-phase7.sh

      - name: Run Phase 8 release smoke
        run: ./scripts/test-phase8.sh
